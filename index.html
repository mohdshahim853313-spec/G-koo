<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gkoo-logo.svg" />
    <link rel="apple-touch-icon" href="/gkoo-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="G-koo" />
    <title>G-koo | Gamified Learning</title>
    <script id="google-gsi-script" src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#0B0E17] select-none m-0 p-0">
    <div id="root">
      <div style="position:fixed;inset:0;background:#0B0E17;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;">
        <div style="width:160px;height:160px;margin-bottom:24px;">
          <img src="/gkoo-logo.svg" alt="G-koo Mascot" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(255,95,109,0.3));" />
        </div>
        <h1 style="margin:0;font-size:38px;font-weight:900;color:#FF5F6D;letter-spacing:-0.5px;">G-koo</h1>
        <p style="margin:10px 0 28px;font-size:14px;font-weight:700;color:#9CA3AF;letter-spacing:0.3px;">ज्ञान का नया अंदाज़ • Gamified Learning</p>
        <div style="width:130px;height:5px;background:#1F2937;border-radius:9999px;overflow:hidden;position:relative;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,#FF5F6D,#FF7B7B);border-radius:9999px;animation:gkooProgress 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes gkooProgress {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
