<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gkoo-logo.svg" />
    <link rel="apple-touch-icon" href="/gkoo-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5F6D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gkoo" />
    <title>Gkoo | Gamified Learning</title>
  </head>
  <body class="m-0 p-0" style="background-color:#FF5F6D;">
    <div id="root"></div>
    <script>
      // 1. Vite chunk preload error handler (auto-reload on updated build)
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        window.location.reload();
      });

      // 2. Service worker registration (Production only - completely disabled on localhost/dev)
      if ('serviceWorker' in navigator) {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port !== '';
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) {
                caches.delete(k);
              });
            });
          }
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.onupdatefound = function() {
                var inst = reg.installing;
                if (inst) {
                  inst.onstatechange = function() {
                    if (inst.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  };
                }
              };
            }).catch(function(err) {
              console.log('SW registration skipped:', err);
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
